name: Go

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: glimps-re/go-actions@v0.4.0
        with:
          go-version: '1.27'

      - name: cross-build for windows
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build ./...
            GOOS=windows GOARCH=$arch go vet ./...
          done
