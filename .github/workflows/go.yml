name: Go

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: glimps-re/go-actions@v0.4.0
        with:
          go-version: '1.27'

      - name: vet for windows
        run: GOOS=windows go vet ./...
